services:
  orszag-varos:
    image: node:20-alpine
    container_name: orszag-varos
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - PORT=3000
    volumes:
      # A játék mappája a NAS-on (az elérési utat igazítsd a sajátodhoz)
      - /volume1/Docker/orszag-varos:/app:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
